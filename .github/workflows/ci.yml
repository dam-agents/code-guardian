# CI for the agent definition — mechanizes the validation sweep of
# docs/self-modification.md §9 on every PR. Runs on GitHub only; the deployed
# pod never executes this (zero runtime cost).
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: |
          set -e
          find scripts -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n scripts/tests/bin/gh scripts/tests/bin/curl

      - name: Preflight stub tests
        run: bash scripts/tests/run.sh

      - name: VERSION matches the newest CHANGELOG entry
        run: |
          v="$(head -1 VERSION | tr -d '[:space:]')"
          top="$(grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+ ' CHANGELOG.md | sed -E 's/^## ([0-9.]+).*/\1/')"
          echo "VERSION=$v, newest CHANGELOG entry=$top"
          [ "$v" = "$top" ]

      # docs/self-modification.md §12: entries already on the base branch are
      # released history, and a new entry lands only on top. A branch overtaken
      # by another release must re-number its own pending entry — and git does
      # not force it to: when the two headings are byte-identical they merge
      # into one with no conflict, and the version check above still passes
      # because VERSION equals a number that is already released.
      - name: The newest CHANGELOG entry is unreleased and on top
        if: github.event_name == 'pull_request'
        run: |
          set -e
          base="${{ github.base_ref }}"
          git fetch --depth=1 origin "$base"
          ver() { grep -m1 -E '^## [0-9]+\.[0-9]+\.[0-9]+ ' | sed -E 's/^## ([0-9.]+).*/\1/'; }
          top="$(ver < CHANGELOG.md)"
          basetop="$(git show FETCH_HEAD:CHANGELOG.md | ver)"
          echo "this branch: $top, newest on $base: $basetop"
          # an unreadable CHANGELOG makes both tests below vacuously true, so it
          # is an error, never a pass
          [ -n "$top" ]     || { echo "no version entry in this branch's CHANGELOG.md"; exit 1; }
          [ -n "$basetop" ] || { echo "could not read a version entry in $base's CHANGELOG.md"; exit 1; }
          # literal compare — a version's dots are regex metacharacters
          esc="$(printf '%s' "$top" | sed 's/\./\\./g')"
          if git show "FETCH_HEAD:CHANGELOG.md" | grep -qE "^## $esc "; then
            echo "$top is already released on $base — re-number this branch's pending entry, never the entry that overtook it (docs/self-modification.md §12)"
            exit 1
          fi
          # and it must sort above the base's newest: an unreleased number below
          # it would land under released history
          if [ "$top" = "$(printf '%s\n%s\n' "$top" "$basetop" | sort -V | head -1)" ]; then
            echo "$top is below $base's newest entry $basetop — re-number upward (docs/self-modification.md §12)"
            exit 1
          fi
          echo "$top is unreleased and above $basetop"

      - name: Internal doc links resolve
        run: |
          rc=0
          for f in CLAUDE.md README.md ONBOARDING.md docs/*.md; do
            base="$(dirname "$f")"
            for t in $(grep -oE '\]\([^)#]+(#[^)]*)?\)' "$f" | sed -E 's/^\]\(//; s/\)$//; s/#.*$//'); do
              [ -z "$t" ] && continue
              case "$t" in http*|mailto:*) continue;; *'<'*|*'$'*|*…*) continue;; esac  # placeholders
              [ -e "$base/$t" ] || [ -e "$t" ] || { echo "broken link in $f -> $t"; rc=1; }
            done
          done
          exit $rc

      # Cross-file section references ("<file>.md → **Label**"). They are prose,
      # not anchors, so a renamed section breaks them silently — this is the
      # grep that docs/self-modification.md §11 asks a human to remember.
      - name: Cross-file section references resolve
        run: |
          set -u
          rc=0; n=0
          tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
          # every heading text and bold run-in label of a file = its anchors
          anchors() { sed -nE 's/^#{1,6} +(.*)$/\1/p; s/^\*\*([^*]+)\*\*.*$/\1/p' "$1" | tr -s ' '; }
          for f in CLAUDE.md AGENTS.md README.md ONBOARDING.md docs/*.md; do
            base="$(dirname "$f")"
            # join lines first: a reference may wrap mid-sentence
            tr '\n' ' ' < "$f" | tr -s ' ' \
              | grep -oE '\[?[A-Za-z0-9_./-]+\.md\)? → \*\*[^*]+\*\*' > "$tmp/refs" || true
            while read -r ref; do
              [ -n "$ref" ] || continue
              t="${ref%% → *}"; t="${t#[}"; t="${t%)}"
              label="${ref#* → \*\*}"; label="${label%\*\*}"
              path=
              for cand in "$base/$t" "$t" "docs/$t"; do
                [ -f "$cand" ] && { path="$cand"; break; }
              done
              [ -n "$path" ] || { echo "$f: unresolvable file in '$ref'"; rc=1; continue; }
              n=$((n + 1)); hit=
              anchors "$path" > "$tmp/anchors"
              # literal prefix compare — a label may hold regex metacharacters
              while read -r a; do
                [ "${a:0:${#label}}" = "$label" ] && { hit=1; break; }
              done < "$tmp/anchors"
              [ -n "$hit" ] || { echo "$f -> $path: no section '$label'"; rc=1; }
            done < "$tmp/refs"
          done
          echo "checked $n cross-file section references"
          exit $rc

      # kit.yaml carries ONBOARDING Step 6's schedules verbatim for a new
      # instance, because the platform reads YAML and cannot follow a link
      # (docs/self-modification.md §3). Step 6 stays the single source of truth,
      # and this step is what keeps the copy equal to it.
      - name: kit.yaml matches ONBOARDING Step 6
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || pip install --quiet pyyaml 2>/dev/null \
            || pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import re, sys, yaml

          md = open('ONBOARDING.md').read()
          head = '## Step 6 — Ensure the scheduled jobs exist'
          if head not in md:
              sys.exit('ONBOARDING.md: Step 6 heading not found — this check cannot run')
          step6 = md.split(head)[1].split('\n## ')[0]

          quotes = [' '.join(l[2:].split()) for l in step6.splitlines() if l.startswith('> ')]
          if len(quotes) != 4:
              sys.exit('ONBOARDING Step 6: expected 4 task blockquotes, found %d' % len(quotes))
          crons = {c for c in re.findall(r'`([^`]+)`', step6)
                   if re.fullmatch(r'[-0-9*/,]+( [-0-9*/,]+){4}', c)}
          modes = set(re.findall(r'precheck: bash "\$HOME/scripts/precheck\.sh" (\w+)', step6))
          names = set(re.findall(r'code-guardian-[a-z0-9-]+', step6))

          # Step 6 defines four runs; a kit schedule joins one by its name prefix.
          # Per run: its task blockquote, its precheck mode, and whether the kit
          # creates it enabled (the Slack and benchmark runs wait for their key).
          SPEC = {'code-guardian-review-':    (0, 'review',    True),
                  'code-guardian-shepherd-':  (1, 'shepherd',  False),
                  'code-guardian-audit-':     (2, None,        True),
                  'code-guardian-benchmark-': (3, 'benchmark', False)}

          schedules = yaml.safe_load(open('kit.yaml')).get('schedules') or []
          bad, kit_crons = [], set()
          for s in schedules:
              name = s.get('name', '<unnamed>')
              prefix = next((p for p in SPEC if name.startswith(p)), None)
              if prefix is None:
                  bad.append('%s: Step 6 defines no run of this name' % name)
                  continue
              if not (name in names or any(n.endswith('-') and name.startswith(n) for n in names)):
                  bad.append('%s: Step 6 names no such schedule' % name)
              quote, mode, enabled = SPEC[prefix]
              if ' '.join((s.get('task') or '').split()) != quotes[quote]:
                  bad.append('%s: task text differs from its Step 6 blockquote' % name)
              want = 'bash "$HOME/scripts/precheck.sh" %s' % mode if mode else None
              if mode and mode not in modes:
                  bad.append('%s: Step 6 no longer gates this run with precheck.sh %s' % (name, mode))
              if s.get('precheck') != want:
                  bad.append('%s: precheck is %r, Step 6 says %r' % (name, s.get('precheck'), want))
              if s.get('enabled', True) != enabled:
                  bad.append('%s: enabled is %s, Step 6 makes it %s' % (name, s.get('enabled', True), enabled))
              for key in ('timezone', 'rrule'):
                  if key in s:
                      bad.append('%s: %s belongs to the instance, never to the kit' % (name, key))
              if 'cron' in s:
                  kit_crons.add(s['cron'])
              else:
                  bad.append('%s: no cron' % name)

          if kit_crons != crons:
              bad.append('crons differ — kit.yaml: %s, Step 6: %s' % (sorted(kit_crons), sorted(crons)))
          for line in bad:
              print(line)
          print('checked %d kit schedules against ONBOARDING Step 6' % len(schedules))
          sys.exit(1 if bad else 0)
          PY

      # The rest of kit.yaml — what a NEW instance is given. Nothing in a run
      # reads it, so a stale field surfaces only at the next instance creation
      # (docs/self-modification.md §9). These are the pairs a machine can check;
      # the catalog text stays the sweep's.
      - name: kit.yaml matches the definition
        run: |
          python3 -c 'import yaml' 2>/dev/null \
            || pip install --quiet pyyaml 2>/dev/null \
            || pip install --quiet --break-system-packages pyyaml
          python3 - <<'PY'
          import os, re, sys, yaml

          kit = yaml.safe_load(open('kit.yaml'))
          bad = []

          def need(cond, msg):
              if not cond:
                  bad.append(msg)

          need(kit.get('schemaVersion') == 'v1',
               'schemaVersion is %r, the schema this file pins is v1' % kit.get('schemaVersion'))
          for key in ('id', 'name', 'description', 'category'):
              need(str(kit.get(key) or '').strip(), '%s is empty — the schema requires it' % key)

          kid = kit.get('id') or ''

          # id <-> the names the definition builds from it
          onb = open('ONBOARDING.md').read()
          need('$HOME/.%s-onboarded' % kid in onb,
               'ONBOARDING.md names no $HOME/.%s-onboarded sentinel' % kid)
          for s in kit.get('schedules') or []:
              need((s.get('name') or '').startswith(kid + '-'),
                   'schedule %r does not start with the kit id %r' % (s.get('name'), kid))

          # the paths the platform resolves when it creates an instance
          skills = (kit.get('bundledSkills') or {}).get('path')
          need(skills and os.path.isdir(skills),
               'bundledSkills.path %r is not a directory in this repo' % skills)

          seed = kit.get('seed') or {}
          need(seed.get('self') is True, 'seed.self must be true — the kit ships this commit')
          need(seed.get('into') == 'home',
               'seed.into is %r, the definition lives at $HOME (docs/persistence.md)' % seed.get('into'))

          onboarding = kit.get('onboarding')
          need(isinstance(onboarding, dict) and 'ONBOARDING.md' in (onboarding.get('prompt') or ''),
               'onboarding.prompt does not send the first turn to ONBOARDING.md')

          # a connection the kit marks required is one onboarding can count on
          accepts = [a for c in (kit.get('connections') or []) if c.get('required')
                     for a in (c.get('accepts') or [])]
          need('github' in accepts, 'no required github connection')

          for line in bad:
              print(line)
          print('checked %d kit.yaml pairs against the definition' % (10 + len(kit.get('schedules') or [])))
          sys.exit(1 if bad else 0)
          PY
