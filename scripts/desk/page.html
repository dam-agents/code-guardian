<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Code Guardian</title>
<!-- Code Guardian's Desk (docs/desk.md). Its skeleton, its look and its rules are Design Desk's Desk
     (github.com/xjacka/design-desk, desk/page.html) as Quality Inspector's dashboard takes them over:
     the <style> below is that stylesheet as it is, but the product's colour (--accent, --info-soft),
     indigo. Change a shared rule in every page of the family. -->
<script>
  // Before the first paint, so a chosen mode never flashes the other one.
  try { const t = localStorage.getItem("cg-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
  :root {
    --bg: #fcfbfc; --panel: #ffffff; --ink: #1b1b1a; --muted: #6b6b66; --line: #e4e3df; --soft: #f0efeb;
    --tip-opens: #6fd3a0; --accent: #4a47b8; --accent-ink: #ffffff; --ok: #1f7a4d; --ok-soft: #e3f3ea; --warn: #9a6200; --warn-soft: #fbf0d9;
    --bad: #b3261e; --bad-soft: #fbe5e3; --info-soft: #ebeafb; --live: #6b3fc4; --live-soft: #efe8fb; --why: #0d7d78; --why-soft: #e0f3f1; --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --radius: 10px; --r-lg: 12px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
    /* What floats over the page (the private ask): a near shadow for the edge, a far one for the lift. */
    --float: 0 2px 6px rgba(0,0,0,.10), 0 14px 32px rgba(0,0,0,.18), 0 36px 84px rgba(0,0,0,.24);
    --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    /* The page grows with the window: text runs wider, the list and pictures get room. */
    --measure: 96ch; --pad-x: 32px; --list-w: 380px; --side-w: 380px; --shot-w: 260px; --shot-h: 260px;
  }
  @media (min-width: 1280px) { :root { --measure: 112ch; --pad-x: 40px; --list-w: 440px; --side-w: 420px; --shot-w: 300px; --shot-h: 320px; } }
  @media (min-width: 1600px) { :root { --measure: 132ch; --pad-x: 48px; --list-w: 480px; --side-w: 460px; --shot-w: 340px; --shot-h: 380px; } }
  @media (min-width: 2200px) { :root { --measure: 150ch; --pad-x: 64px; --list-w: 550px; --side-w: 520px; --shot-w: 400px; --shot-h: 440px; } }
  /* Night follows the system unless the header switch chose a mode (data-theme). */

    :root:not([data-theme="light"]) { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #a09f99; --line: #33332f; --soft: #262624;
      --tip-opens: #1f7a4d; --accent: #a9a6ff; --accent-ink: #16153a; --ok: #6fd3a0; --ok-soft: #1c2f25; --warn: #f0c060; --warn-soft: #34291a;
      --bad: #ff8a80; --bad-soft: #3a1f1d; --info-soft: #25244a; --live: #c3a6ff; --live-soft: #2a2140; --why: #62d2c8; --why-soft: #16302e; --shadow: none; --float: 0 0 0 1px rgba(255,255,255,.10), 0 14px 36px rgba(0,0,0,.6), 0 36px 90px rgba(0,0,0,.7); color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #151514; --panel: #1e1e1c; --ink: #ecebe7; --muted: #a09f99; --line: #33332f; --soft: #262624;
    --tip-opens: #1f7a4d; --accent: #a9a6ff; --accent-ink: #16153a; --ok: #6fd3a0; --ok-soft: #1c2f25; --warn: #f0c060; --warn-soft: #34291a;
    --bad: #ff8a80; --bad-soft: #3a1f1d; --info-soft: #25244a; --live: #c3a6ff; --live-soft: #2a2140; --why: #62d2c8; --why-soft: #16302e; --shadow: none; --float: 0 0 0 1px rgba(255,255,255,.10), 0 14px 36px rgba(0,0,0,.6), 0 36px 90px rgba(0,0,0,.7); color-scheme: dark; }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
  button { font: inherit; color: inherit; }
  /* Links read in ink with a faint underline; under the pointer only the underline darkens, the ink stays. */
  a { color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, currentColor 28%, transparent); text-underline-offset: 3px; transition: color .12s ease, text-decoration-color .12s ease; }
  a:hover { text-decoration-color: currentColor; }
  .app { display: grid; grid-template-rows: auto auto 1fr; grid-template-columns: minmax(0, 1fr); height: 100%; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  /* An open header menu (the bell, your menu) floats above the private chat (75); only while
     open, so the header never shows through the design workspace (70). */
  header:has(details.more[open]) { position: relative; z-index: 76; }
  header h1 { font-size: var(--fs-ui); margin: 0; font-weight: 600; letter-spacing: .01em; }
  /* Requests leads the menu; the other tabs are smaller, their counts grey. */
  nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  nav button { border: 0; background: transparent; padding: 8px 12px; border-radius: var(--r-md); cursor: pointer; color: var(--muted); font-size: var(--fs-meta); }
  nav button[aria-current="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
  nav .sep, header > .head-sep { width: 1px; height: 18px; background: var(--line); margin: 0 8px; }
  /* New request sits right after the tabs, behind one more separator. */
  header > .head-sep { margin: 0 -4px; } header > .head-sep[hidden] { display: none; }
  nav .count { display: inline-block; min-width: 18px; padding: 0 8px; margin-left: 8px; border-radius: var(--r-md); background: var(--soft); color: var(--muted); font-size: var(--fs-micro); line-height: 17px; text-align: center; font-weight: 500; }
  /* Every count is grey; amber only while a request waits for an answer. */
  nav .count.warn { background: var(--warn); color: var(--bg); font-weight: 600; }
  .grow { flex: 1; }
  .me-menu .me { color: var(--muted); font-size: var(--fs-meta); }
  /* Your name opens your menu: Settings, How it works, simple mode, day or night mode. */
  details.me-menu > summary.me { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: var(--r-md); }
  details.me-menu > summary.me:hover, details.me-menu[open] > summary.me { background: var(--soft); color: var(--ink); }
  details.me-menu > summary.me::after { content: "▾"; font-size: 10px; }
  /* The gap alone spaces the role's icon: the space after "·" falls away in the flex row. */
  details.me-menu > summary.me .role-ic { margin: 0; }
  details.me-menu > summary.me .who-full { display: inline-flex; align-items: center; gap: 4px; }
  details.me-menu > summary.me .av { display: none; width: 24px; height: 24px; border-radius: 50%; place-items: center; background: var(--soft); color: var(--ink); font-size: var(--fs-micro); font-weight: 600; }
  details.me-menu .me-who { display: none; padding: 4px 8px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: var(--fs-meta); white-space: nowrap; }
  @media (max-width: 1279px) {
    header { gap: 12px; padding: 12px 16px; }
    details.me-menu > summary.me .who-full { display: none; } details.me-menu > summary.me .av { display: inline-grid; } details.me-menu .me-who { display: block; }
  }
  details.more.me-menu .menu { left: auto; right: 0; min-width: 100%; box-sizing: border-box; }
  details.me-menu .menu .btn[aria-current="true"] { background: var(--soft); font-weight: 600; }
  /* The bell (docs/desk-page.md → Notifications): one row per event, every row the same five facts. */
  details.bell { position: relative; }
  details.bell > summary { list-style: none; position: relative; display: grid; place-items: center; width: 32px; height: 32px; border-radius: var(--r-md); cursor: pointer; color: var(--muted); }
  details.bell > summary::-webkit-details-marker { display: none; }
  details.bell > summary:hover, details.bell[open] > summary { background: var(--soft); color: var(--ink); }
  details.bell > summary svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  details.bell .badge { position: absolute; top: -3px; right: -5px; min-width: 18px; height: 18px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: var(--bad); color: var(--bg); font-size: var(--fs-micro); font-weight: 600; line-height: 14px; text-align: center; white-space: nowrap; border: 2px solid var(--panel); }
  details.bell .menu.notes { left: auto; right: 0; width: min(420px, calc(100vw - 24px)); max-width: none; padding: 0; gap: 0; overflow: hidden; }
  #notes .nh { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; border-bottom: 1px solid var(--line); }
  #notes .nh b { font-size: var(--fs-ui); flex: 1; }
  #notes .nh .nmark { font-size: var(--fs-meta); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; } #notes .nh .nmark:hover { text-decoration: underline; }
  #notes .nh .tabs2 { display: flex; gap: 2px; background: var(--soft); padding: 2px; border-radius: var(--r-sm); }
  #notes .nh .tabs2 button { border: 0; background: transparent; padding: 2px 12px; border-radius: var(--r-xs); font-size: var(--fs-meta); color: var(--muted); cursor: pointer; }
  #notes .nh .tabs2 button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
  #notes .nl { max-height: min(560px, 70vh); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 8px 12px; }
  #notes .day { padding: 12px 8px 0; font-size: var(--fs-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #notes .note { --c: var(--muted); display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; column-gap: 12px; width: 100%; padding: 12px 12px 12px 12px; border: 0; border-left: 3px solid transparent; border-radius: var(--r-md); background: transparent; text-align: left; cursor: pointer; font-size: var(--fs-meta); line-height: 1.4; }
  #notes .note:hover { background: var(--soft); }
  #notes .note.unread { border-left-color: var(--accent); background: color-mix(in srgb, var(--info-soft) 55%, transparent); }
  #notes .note .ic { grid-row: 1 / span 2; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); }
  #notes .note .ic svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  /* A row is at most three lines: what and who, the item, what was said; each line cuts with … */
  #notes .note .ev { font-weight: 600; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notes .note .ev span { font-weight: 400; color: var(--muted); }
  #notes .note time { font-size: var(--fs-micro); color: var(--muted); white-space: nowrap; }
  #notes .note .ti { grid-column: 2 / span 2; display: flex; gap: 8px; align-items: baseline; min-width: 0; color: var(--ink); }
  #notes .note .ti span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #notes .note .ti .num { margin-left: auto; flex: none; font-size: var(--fs-micro); }
  #notes .note .ti em { font-style: normal; color: var(--muted); }
  #notes .note .q { grid-column: 2 / span 2; margin-top: 4px; font-size: var(--fs-meta); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-style: italic; }
  #notes .empty { padding: 28px 16px; text-align: center; color: var(--muted); font-size: var(--fs-meta); }
  #notes .note[data-g="talk"] { --c: var(--accent); } #notes .note[data-g="agent"] { --c: var(--why); } #notes .note[data-g="new"] { --c: var(--live); }
  #notes .note[data-g="design"] { --c: #e0701a; } #notes .note[data-g="ok"] { --c: var(--approved); } #notes .note[data-g="decision"] { --c: var(--decided); } #notes .note[data-g="closed"] { --c: var(--closed); }
  .intro figure.flow { margin: 16px 0 4px; }
  /* An item's number (docs/desk.md → Links to an item): grey next to its title, so the title leads. */
  .num { color: var(--muted); font-weight: 400; font-family: var(--mono); font-size: .7em; white-space: nowrap; margin-left: .45em; }
  .row .t .num { margin-left: auto; font-size: var(--fs-micro); flex: 0 1 auto; max-width: 40%; overflow: hidden; text-overflow: ellipsis; }
  .row .t > span:first-child { flex: 1 1 auto; min-width: 0; }
  /* A row with no state keeps its number where every other row has it, left of the dot. */
  .row .t .num:last-child { margin-right: 20px; }
  /* Search across the Desk: items, decisions, numbers and GitHub issues and pull requests. */
  header .search { position: relative; }
  header .goto { width: clamp(15ch, 16vw, 28ch); padding: 8px 12px; font-size: var(--fs-meta); transition: width .15s; }
  @media (max-width: 1279px) { header .goto { width: 12ch; } }
  header .goto:focus { width: min(36ch, 60vw); }
  #hits { position: fixed; z-index: 60; width: min(440px, calc(100vw - 24px)); max-height: 70vh; overflow: auto; padding: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  #hits .hit { text-decoration: none; display: grid; grid-template-columns: auto 1fr auto; gap: 2px 8px; align-items: baseline; width: 100%; text-align: left; padding: 8px 12px; border: 0; background: none; border-radius: var(--r-sm); font: inherit; color: inherit; cursor: pointer; }
  #hits .hit:hover, #hits .hit[aria-selected="true"] { background: var(--soft); }
  #hits .hit .k { font-size: var(--fs-micro); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  #hits .hit .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hits .hit .num { font-size: var(--fs-micro); }
  #hits .hit .why { grid-column: 2 / 4; font-size: var(--fs-meta); color: var(--muted); }
  #hits .none { padding: 8px 12px; color: var(--muted); font-size: var(--fs-meta); }
  .theme { width: 32px; height: 32px; padding: 0; justify-content: center; font-size: var(--fs-ui); line-height: 1; }
  .theme.help { font-size: var(--fs-head); font-weight: 600; }
  .theme svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; }
  .theme[aria-current="true"] { background: var(--soft); border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  /* Simple mode in your menu: its words, then an on/off switch, on in the accent. */
  #simple, #figma { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #figma[hidden] { display: none; }
  #simple .sw, #figma .sw { position: relative; flex: none; width: 28px; height: 16px; border-radius: var(--r-md); background: var(--line); transition: background .15s; }
  #simple .sw::after, #figma .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  #simple[aria-pressed="true"] .sw, #figma[aria-pressed="true"] .sw { background: var(--accent); }
  #simple[aria-pressed="true"] .sw::after, #figma[aria-pressed="true"] .sw::after { transform: translateX(12px); }
  .banner { padding: 8px 20px; font-size: var(--fs-meta); border-bottom: 1px solid var(--line); background: var(--info-soft); }
  .banner.warn { background: var(--warn-soft); }
  /* A tab's intro: what it shows, what you can do, the steps; in the empty pane beside the list, folded per browser. */
  .intro { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); font-size: var(--fs-meta); padding: 16px 20px; max-width: 900px; margin: 0 auto; }
  .intro > summary { list-style: none; cursor: pointer; margin: 0; display: flex; gap: 8px; align-items: baseline; font-size: var(--fs-ui); color: var(--muted); }
  .intro > summary::-webkit-details-marker { display: none; }
  .intro[open] > summary { margin-bottom: 8px; }
  .intro > summary b { color: var(--ink); }
  .intro > summary .how { margin-left: auto; font-size: var(--fs-meta); white-space: nowrap; }
  .intro > summary .how + .tog { margin-left: 12px; }
  .intro > summary .tog { margin-left: auto; color: var(--accent); font-size: var(--fs-meta); white-space: nowrap; }
  .intro > summary .tog::after { content: "Show ▸"; } .intro[open] > summary .tog::after { content: "Hide ▾"; }
  .intro > summary .i { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--info-soft); color: var(--accent); font-weight: 600; font-size: var(--fs-micro); flex: none; align-self: center; }
  .intro .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 28px; }
  .intro h5 { margin: 4px 0 4px; font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .intro ul, .intro ol { margin: 0; padding-left: 20px; } .intro li { margin-bottom: 4px; }
  /* A process: its flow, a colour key, then the steps, each numbered in the colour of its box. */
  .process figure.flow figcaption { display: none; }
  .process .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 2px 0 12px; font-size: var(--fs-meta); color: var(--muted); }
  .process .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: var(--r-xs); margin-right: 8px; vertical-align: -1px; border: 1.2px solid var(--line); background: var(--soft); }
  .process ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: st; display: grid; gap: 16px; max-width: 680px; line-height: 22px; }
  .process ol.steps > li { counter-increment: st; position: relative; padding-left: 36px; margin: 0; min-height: 22px; }
  .process ol.steps > li::before { content: counter(st); position: absolute; left: 0; top: 0; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; display: grid; place-items: center; font-size: var(--fs-micro); line-height: 1; font-weight: 600; font-variant-numeric: tabular-nums; background: var(--soft); border: 1px solid var(--line); color: var(--ink); }
  .process [data-tone="checking"]::before { background: var(--info-soft) !important; border-color: var(--accent) !important; }
  .process [data-tone="waiting"]::before { background: var(--warn-soft) !important; border-color: var(--warn) !important; }
  .process [data-tone="live"]::before { background: var(--live-soft) !important; border-color: var(--live) !important; }
  .process [data-tone="approved"]::before { background: var(--ok-soft) !important; border-color: var(--ok) !important; }
  .process ol.steps .you { font-weight: 600; color: var(--accent); margin-right: -4px; }
  .process ol.steps .acts { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 4px; color: var(--muted); }
  .process p.tip { margin: 12px 0 0; color: var(--muted); font-size: var(--fs-meta); }
  .guide > p.tip { margin-top: 16px; color: var(--muted); font-size: var(--fs-meta); }
  .guide .process h5 { margin: 12px 0 8px; font-size: var(--fs-micro); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .pick { color: var(--muted); text-align: center; margin: 0 0 16px; }
  /* People shows at once: its intro on top, beside it on a wide screen. */
  .btn > .ico { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn.small > .ico { width: 13px; height: 13px; }
  /* What a button or label does, the moment the pointer is on it (docs/desk-page.md → Tooltips). */
  #tip { position: fixed; z-index: 90; max-width: min(320px, calc(100vw - 16px)); padding: 8px 12px; border-radius: var(--r-sm); background: var(--ink); color: var(--bg); font-size: var(--fs-meta); line-height: 1.4; font-weight: 400; text-transform: none; letter-spacing: 0; box-shadow: var(--shadow); pointer-events: none; }
  /* "[Opens a dialog]" in a tooltip: the other theme's green (blue reads as a link), as the box is the page's ink. */
  #tip .opens { color: var(--tip-opens); font-weight: 600; }
  /* A tool's tip: its name and key on top, what it does under them. */
  #tip .tk { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 2px; }
  #tip .tk kbd { padding: 0 4px; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); border-bottom-width: 1px; color: inherit; font-size: var(--fs-micro); line-height: 16px; }
  .btn { border: 1px solid var(--line); background: var(--panel); padding: 4px 12px; border-radius: var(--r-md); cursor: pointer; text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { background: var(--soft); }
  .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  .btn.primary:hover { opacity: .9; }
  .btn.small { padding: 2px 12px; font-size: var(--fs-meta); }
  .btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
  .panel.env { max-width: var(--measure); margin-top: 12px; }
  .panel.env { padding-top: 12px; padding-bottom: 12px; }
  .panel.env .env-head { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .panel.env .env-act { margin-left: auto; }
  details.env > summary { cursor: pointer; list-style: none; } details.env > summary::-webkit-details-marker { display: none; }
  details.env > summary::after { content: "+"; color: var(--muted); font-size: 16px; line-height: 1; }
  details.env[open] > summary::after { content: "−"; } details.env[open] > summary { margin-bottom: 4px; }
  .panel.env .env-head .one-line { display: inline-flex; gap: 12px; font-size: var(--fs-meta); } .panel.env .k { color: var(--muted); }

    .ws-body { grid-template-columns: 1fr; grid-template-rows: 55vh auto; } .ws-side { border-left: 0; border-top: 1px solid var(--line); }
  }

  /* ---------- the request page's look (from the team's request-page prototype) ----------
     The Desk's neutrals stay. Each outcome of a request has its own ink: amber while it
     waits on the team, magenta for a person's move, green approved, slate decided, red closed,
     blue while it waits on Design Desk. One green, one amber, one red, one violet on every page:
     these inks are the Desk's own --ok, --warn, --bad and --live, never a near copy. */
  :root { --approved: var(--ok); --approved-soft: var(--ok-soft); --waiting: var(--warn); --waiting-soft: var(--warn-soft); --turn: #a8256f; --turn-soft: #fae3ef;
    --decided: #33557f; --decided-soft: #e4ebf5; --closed: var(--bad); --closed-soft: var(--bad-soft);
    --canvas: #edebe7; --dot: #d6d4cd;
    /* A pull request's and an issue's state: open green, merged violet, draft grey, in the Desk's own inks. */
    --gh-open: var(--ok); --gh-draft: var(--muted); --gh-merged: var(--live);
    --fs-title: 26px; --fs-head: 17px; --fs-ui: 14px; --fs-meta: 12.5px; --fs-micro: 11px; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --turn: #f28cc6; --turn-soft: #3a1d2e;
    --decided: #9bb8e0; --decided-soft: #1d2633; --canvas: #232321; --dot: #383835; } }
  :root[data-theme="dark"] { --turn: #f28cc6; --turn-soft: #3a1d2e;
    --decided: #9bb8e0; --decided-soft: #1d2633; --canvas: #232321; --dot: #383835; }
  body { font-variant-numeric: tabular-nums; }
  :is(button, a, input, textarea, summary, [tabindex]):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Five text sizes: the page title, headings, reading text, the interface, small print. */
  .detail h2 { font-size: var(--fs-title); line-height: 1.2; font-weight: 600; letter-spacing: -.015em; }
  .detail h3 { font-size: var(--fs-head); text-transform: none; letter-spacing: -.01em; color: var(--ink); }
  .lead { font-size: var(--fs-ui); line-height: 1.55; }
  /* A request's state, in the list and on its page, in the same ink, with a dot. */
  .tag { --t: var(--muted); --ts: var(--soft); gap: 8px; padding: 1px 12px 1px 8px; font-size: var(--fs-meta); font-weight: 500; color: var(--t); background: var(--ts); }
  .tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
  .t-approved { --t: var(--approved); --ts: var(--approved-soft); } .t-waiting { --t: var(--waiting); --ts: var(--waiting-soft); }
  .t-decided { --t: var(--decided); --ts: var(--decided-soft); } .t-closed { --t: var(--closed); --ts: var(--closed-soft); }
  .t-checking { --t: var(--accent); --ts: var(--info-soft); } .t-turn { --t: var(--turn); --ts: var(--turn-soft); } .t-live { --t: var(--live); --ts: var(--live-soft); }
  .t-checking::before { background: none; box-shadow: inset 0 0 0 1.5px currentColor; }
  /* A request's state in the list: a dot as large as the one on the request's page, in the top-right corner of
     its row, level with the title's first line, in the state's own colour. It pulses while Design
     Desk works on it and stays lit once it is done. Pointing at the dot itself (not the row)
     unfolds it leftwards into the label with its words, over the title, so nothing moves. */
  .row .t .sdot { --dd: 10px; --dh: 20px; position: relative; flex: none; align-self: flex-start; width: var(--dd); height: max(var(--dh), 1lh); }
  .sdot .tag { position: absolute; right: 0; top: 50%; z-index: 1; transform: translateY(-50%); box-sizing: border-box; height: var(--dd); min-width: var(--dd); padding: 0; gap: 0; justify-content: center;
    color: var(--t); background: var(--t); box-shadow: none; white-space: nowrap; cursor: default; transition: height .35s ease, background .35s ease, padding .35s ease, gap .35s ease, box-shadow .35s ease; }
  .sdot .tag::before { width: 0; height: 7px; transition: width .35s ease; }
  .sdot .tag.busy { animation: pulse 1.2s ease-in-out infinite; }
  .sdot .tag.busy::before, .sdot .tag.t-checking::before { background: currentColor; box-shadow: none; }
  .sdot .tag .w { display: inline-block; max-width: 0; overflow: hidden; opacity: 0; vertical-align: bottom; transition: max-width .45s ease, opacity .35s ease; }
  .row .sdot:hover .tag, .row .open:focus-visible .sdot .tag { animation: none; height: var(--dh); background: color-mix(in srgb, var(--t) 16%, var(--panel)); padding: 0 12px 0 8px; gap: 8px; box-shadow: -8px 0 8px var(--row-bg); }
  .row .sdot:hover .tag::before, .row .open:focus-visible .sdot .tag::before { width: 7px; }
  .row .sdot:hover .tag.busy::before, .row .open:focus-visible .sdot .tag.busy::before { animation: pulse 1.2s ease-in-out infinite; }
  .row .sdot:hover .tag .w, .row .open:focus-visible .sdot .tag .w { max-width: 24ch; opacity: 1; }
  .sdot[data-s="checking"] .tag { --t: var(--accent); } .sdot[data-s="waiting"] .tag { --t: var(--waiting); }
  .sdot[data-s="turn"] .tag { --t: var(--turn); } .sdot[data-s="approved"] .tag { --t: var(--approved); }
  /* A PR's and an issue's state, in GitHub's colours: draft grey, open green, merged and done purple. */
  .sdot[data-s="pr-draft"] .tag { --t: var(--gh-draft); } .sdot[data-s="pr-open"] .tag, .sdot[data-s="issue-open"] .tag { --t: var(--gh-open); }
  .sdot[data-s="pr-merged"] .tag, .sdot[data-s="issue-designed"] .tag { --t: var(--gh-merged); }
  .sdot[data-s="decided"] .tag { --t: var(--decided); } .sdot[data-s="closed"] .tag { --t: var(--closed); }
  /* Product: a screen's or an element's drawing, and a decision in force or revoked. */
  .sdot[data-s="map-current"] .tag, .sdot[data-s="in-force"] .tag { --t: var(--approved); } .sdot[data-s="map-stale"] .tag, .sdot[data-s="unapproved"] .tag { --t: var(--waiting); }
  .sdot[data-s="map-building"] .tag { --t: var(--accent); } .sdot[data-s="map-dropped"] .tag, .sdot[data-s="revoked"] .tag { --t: var(--closed); }
  /* A card that goes against a decision in force: a red ! in the row's right edge, under its state
     dot. Pointing at it unfolds it leftwards, as the dot does, into "Goes against D-n". */
  .row.item > .open .vdot { --dd: 10px; --dh: 20px; position: absolute; z-index: 2; right: 12px; top: calc(10px + max(var(--dh), 1lh)); width: var(--dd); height: var(--dh); }
  .row.item:has(.vdot) > .prov { padding-right: 20px; }
  .vdot .tag { --t: var(--bad); background: transparent; font-weight: 600; }
  .row .sdot.vdot:hover .tag, .row .open:focus-visible .vdot .tag { background: var(--bad-soft); }
  .row .sdot.vdot .tag::before { content: "!"; width: auto; height: auto; border-radius: 0; background: none; box-shadow: none; font-size: var(--fs-ui); font-weight: 600; line-height: 1; }
  @media (prefers-reduced-motion: reduce) { .sdot .tag, .sdot .tag::before, .sdot .tag .w { transition: none; } }
  .chip.ok { background: var(--approved-soft); color: var(--approved); } .chip.warn { background: var(--waiting-soft); color: var(--waiting); }
  /* The status strip: where the request stands, its word in the state's ink, a coloured edge. */
  /* Every state's box looks as a request's: a plain panel with a thin frame; only its word and dot carry the state's colour. */
  .status { --o: var(--muted); --os: var(--soft); padding: 12px 16px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--panel); gap: 8px; }
  .status[data-o="waiting"] { --o: var(--waiting); --os: var(--waiting-soft); } .status[data-o="approved"] { --o: var(--approved); --os: var(--approved-soft); }
  .status[data-o="decided"] { --o: var(--decided); --os: var(--decided-soft); } .status[data-o="closed"] { --o: var(--closed); --os: var(--closed-soft); }
  /* A change's PR and an issue, in GitHub's colours, the same as their dots in the list. */
  .status[data-o="gh-open"] { --o: var(--gh-open); --os: color-mix(in srgb, var(--gh-open) 16%, transparent); } .status[data-o="gh-draft"] { --o: var(--gh-draft); --os: color-mix(in srgb, var(--gh-draft) 16%, transparent); }
  .status[data-o="gh-merged"] { --o: var(--gh-merged); --os: color-mix(in srgb, var(--gh-merged) 16%, transparent); }
  .s-pill { display: inline-flex; align-items: center; padding: 1px 8px; border-radius: 999px; background: var(--o); color: var(--panel); font-size: var(--fs-meta); font-weight: 600; text-decoration: none; white-space: nowrap; } a.s-pill:hover { opacity: .88; }
  .status .s-meta .k { color: var(--muted); } .status .s-meta b { font-weight: 500; color: var(--ink); } .status .s-meta b.late { color: var(--closed); }
  .ai-tag { display: inline-grid; place-items: center; margin-left: 8px; padding: 0 4px; border-radius: var(--r-xs); font-size: var(--fs-micro); font-weight: 600; letter-spacing: .06em; line-height: 14px; color: var(--accent); background: var(--info-soft); vertical-align: 1px; }
  /* The presentation's items: a heading with its buttons, the facts line, what the meeting decides. */
  .agenda-item { scroll-margin-top: 16px; transition: background .4s ease; }
  .agenda-item.hit { animation: ag-hit 1.6s ease-out; } @keyframes ag-hit { 0%, 30% { background: color-mix(in srgb, var(--accent) 14%, transparent); box-shadow: 0 0 0 8px color-mix(in srgb, var(--accent) 14%, transparent); } 100% { background: transparent; box-shadow: 0 0 0 8px transparent; } }
  @media (prefers-reduced-motion: reduce) { .agenda-item.hit { animation: none; outline: 2px solid var(--accent); outline-offset: 6px; } }
  .agenda-item { padding: 16px 0; border-bottom: 1px solid var(--line); max-width: var(--measure); } .agenda-item:last-child { border-bottom: 0; }
  .agenda-item .ai-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; } .agenda-item .ai-head h3 { margin: 0; font-size: var(--fs-head); text-transform: none; letter-spacing: -.01em; color: var(--ink); }
  .agenda-item .ai-head .actions { margin: 0 0 0 auto; } .agenda-item .prov { margin: 4px 0 8px; } .agenda-item .k-head { margin: 8px 0 2px; font-weight: 600; }
  .status .s-meta { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
  .status[data-o="checking"] { --o: var(--accent); --os: var(--info-soft); } .status[data-o="turn"] { --o: var(--turn); --os: var(--turn-soft); } .status[data-o="live"] { --o: var(--live); --os: var(--live-soft); }
  .s-word { position: relative; display: flex; align-items: center; gap: 12px; font-size: var(--fs-head); font-weight: 600; color: var(--o); letter-spacing: -.01em; }
  .s-mark { width: 10px; height: 10px; border-radius: 50%; background: var(--o); flex: none; }
  /* The mark blinks only while Design Desk is at work, never while it waits on a person. */
  .status[data-busy] .s-mark { animation: pulse 1.2s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .status[data-busy] .s-mark { animation: none; } }
  .status .next, .status .working, .status .sent { background: transparent; border: 0; padding: 0; }
  .status .next b { font-weight: 600; }
  .status .spin { background: var(--o); }
  /* The steps: done ones filled in ink, the current one ringed. */
  .step .n { background: none; box-shadow: inset 0 0 0 1.5px var(--line); font-weight: 600; }
  .step.done .n { background: var(--ink); color: var(--panel); box-shadow: none; }
  .step.now .n { background: none; color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink); }
  /* Approve is the one green button. */
  .btn[data-act="approve"] { background: var(--approved); border-color: var(--approved); color: var(--panel); }
  .btn[data-act="approve"]:hover { opacity: .88; background: var(--approved); }
  /* Design options: the tabs stay; each carries a square number, so "option 2" is easy to say. */
  .ono { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 8px; margin-right: 8px; border-radius: var(--r-xs); background: var(--muted); color: var(--panel); font-size: var(--fs-meta); font-weight: 600; vertical-align: 1px; }
  .tabs button[aria-pressed="true"] .ono { background: var(--ink); }
  /* The picked option's panel is a canvas: dots under the design, the design a sheet on it. */
  .vpanel { background: var(--canvas) radial-gradient(circle, var(--dot) 1px, transparent 1.4px) 0 0 / 18px 18px; }
  .vpanel:has(> .vbar) .frame { border: 0; border-radius: var(--r-xs); box-shadow: 0 0 0 1px rgba(0,0,0,.08), 0 5px 16px rgba(0,0,0,.08); }
  .tabs.vtabs button[aria-pressed="true"] { background: var(--canvas); border-bottom-color: var(--canvas); }
  .tally .chip { border: 1px solid color-mix(in srgb, currentColor 25%, var(--line)); }

  /* ---------- one set of controls on every page ---------- */
  /* Buttons: one shape (8px corners), one height per size, never wrapping. */
  .btn { justify-content: center; white-space: nowrap; gap: 8px; font-size: var(--fs-ui); line-height: 1.4; min-height: 32px; }
  .btn.small { font-size: var(--fs-meta); min-height: 26px; padding: 2px 12px; }
  .btn.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
  details > summary.btn { list-style: none; } details > summary.btn::-webkit-details-marker { display: none; }
  .tabs button { font-size: var(--fs-ui); color: var(--ink); }
  nav button { font-size: var(--fs-ui); }
  .subtabs > button[data-filter] { font-size: var(--fs-ui); }
  /* A text link that is a button: the same calm link, no frame, anywhere on the Desk. */
  button.link { border: 0; background: none; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, currentColor 28%, transparent); text-underline-offset: 3px; transition: color .12s ease, text-decoration-color .12s ease; }
  button.link:hover { text-decoration-color: currentColor; }
  .msg .who button.link { font-size: var(--fs-meta); }
  /* Chips: the same pill as the state tags. */
  .chip { font-size: var(--fs-meta); padding: 1px 12px; line-height: 1.5; font-weight: 500; }
  .chip.bad { background: var(--closed-soft); color: var(--closed); }
  .anchor { font-size: var(--fs-meta); }
  /* Votes: pills with their count, grey until someone votes, then green for 👍, red for 👎, amber for ⚠. */
  .btn.vote { border-radius: 999px; background: var(--panel); color: var(--muted); }
  .btn.vote .n { font-weight: 600; }
  .btn.vote.some.up { background: color-mix(in srgb, var(--approved-soft) 70%, var(--panel)); border-color: color-mix(in srgb, var(--approved) 25%, var(--line)); color: var(--approved); }
  .btn.vote.some.concern { background: color-mix(in srgb, var(--waiting-soft) 70%, var(--panel)); border-color: color-mix(in srgb, var(--waiting) 25%, var(--line)); color: var(--waiting); }
  .btn.vote.on.up { border-color: var(--approved); box-shadow: inset 0 0 0 1px var(--approved); color: var(--approved); }
  .btn.vote.on.concern { border-color: var(--waiting); box-shadow: inset 0 0 0 1px var(--waiting); color: var(--waiting); }
  .btn.vote.some.down { background: color-mix(in srgb, var(--bad-soft) 70%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 25%, var(--line)); color: var(--bad); }
  .btn.vote.on.down { border-color: var(--bad); box-shadow: inset 0 0 0 1px var(--bad); color: var(--bad); }
  /* The conversation: newest first, folded under the box until opened. */
  .composer { max-width: var(--measure); }
  details.convo { margin-top: 16px; max-width: var(--measure); }
  details.convo > summary { cursor: pointer; list-style: none; display: inline-flex; gap: 8px; align-items: center; color: var(--ink); font-size: var(--fs-ui); }
  details.convo > summary:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
  details.convo > summary::-webkit-details-marker { display: none; }
  details.convo > summary::before { content: "▸"; font-size: var(--fs-meta); } details.convo[open] > summary::before { content: "▾"; }
  details.convo > summary .cnt { color: var(--muted); }
  details.convo .threads { margin-top: 12px; }
  /* Designs: the questions for the designer sit under their box, as the conversation does on a request. */

  .design-asks { grid-template-columns: minmax(0, 1fr); }
  .thread.mini > summary { display: flex; gap: 8px; align-items: center; padding: 8px 12px; cursor: pointer; list-style: none; font-size: var(--fs-meta); }
  .thread.mini > summary::-webkit-details-marker { display: none; }
  .thread.mini > summary .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .thread.mini > summary .q b { color: var(--ink); font-weight: 600; }
  .thread.mini[open] > summary { border-bottom: 1px solid var(--line); }

  .threads > .thread { min-width: 0; }
  .thread { border-radius: var(--radius); }
  .thread .head { font-size: var(--fs-meta); }
  .msg .who { font-size: var(--fs-meta); color: var(--muted); } .msg .who b { color: var(--ink); }
  .msg.agent { background: var(--soft); }
  .reply { align-items: center; flex-wrap: wrap; } .reply input { flex: 1 1 200px; min-width: 0; width: auto; }
  .panel, .next, .linked, .catalog li { border-radius: var(--radius); }

  /* The link beside an item's number, as on the prototype; the bar keeps it only where the list hides. */
  .linkbtn { border: 0; background: none; padding: 8px; margin-left: 8px; border-radius: var(--r-md); color: var(--muted); cursor: pointer; display: inline-grid; place-items: center; vertical-align: middle; }
  .linkbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .linkbtn:hover { background: var(--soft); color: var(--ink); }
  /* Rename: small, right after the title, shown while the pointer is on the title (always on touch). */

  .linkbtn.rename svg { width: 15px; height: 15px; }
  h2.renamable:hover .linkbtn.rename, .linkbtn.rename:focus-visible { opacity: 1; }
  @media (hover: none) { .linkbtn.rename { opacity: 1; } }
  h2 .h2-tail { white-space: nowrap; }
  h2 .num { margin-left: 12px; font-size: var(--fs-ui); font-weight: 400; color: var(--muted); }
  @media (min-width: 861px) { .crumb { display: none; } }
  /* A filter's count: quiet grey beside its words, as on the prototype. */

  .filters .btn.on .n { color: var(--muted); }
  /* The request's head: a face, who asked and from where, the fold on the right. */

  .brief-k .face { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--approved); color: var(--panel); font-size: var(--fs-meta); font-weight: 600; flex: none; line-height: 1; text-box: trim-both cap alphabetic; }
  .brief-k .ask-who b { color: var(--ink); font-weight: 600; }

  .brief-k .ask-when { white-space: nowrap; }
  /* A request in another language: EN on the head's right, a plain link; the language's code brings the original back. */

  .brief-k .lang-link:hover { text-decoration-color: currentColor; }
  /* Where the request stands comes first, right under its title; what was asked follows. */

  /* What a state means, on hover or focus of the ⓘ (a request: of its word), instead of a sentence on every request. */
  /* The tip hangs from the word's left edge, not centred on the ⓘ: centred, a short word ("Closed") pushed it past the pane's left edge. */
  .s-word .info { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; color: var(--muted); cursor: help; }
  .s-word .info svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
  .s-word :is(.info, .help) .tip { position: absolute; z-index: 30; left: 0; top: calc(100% + 8px); width: max-content; max-width: 300px; padding: 8px 12px; border-radius: var(--r-sm); background: var(--ink); color: var(--panel); font-size: var(--fs-meta); line-height: 1.45; font-weight: 400; letter-spacing: 0; opacity: 0; pointer-events: none; transition: opacity .1s; }
  .s-word .info:hover .tip, .s-word .info:focus-visible .tip { opacity: 1; }
  /* The spec's versions read as plain text: each a link, the one shown in ink. */
  .spec-versions button { border: 0; background: none; padding: 0; font: inherit; cursor: pointer; color: var(--ink); text-decoration: underline; text-decoration-thickness: 1px; text-decoration-color: color-mix(in srgb, currentColor 28%, transparent); text-underline-offset: 3px; transition: text-decoration-color .12s ease; } .spec-versions button:hover { text-decoration-color: currentColor; }
  .spec-versions button[aria-pressed="true"] { color: var(--ink); font-weight: 600; cursor: default; text-decoration: none; }

  /* The state's help: now, then every way on as branches; a move you cannot make is grey, with why. */

  /* On a wide window what was asked and what Design Desk made of it stand side by side. */

<script>

  "use strict";
  // The page's commands: the closed set the Desk server accepts as jobs (scripts/desk/server.mjs reads it from here).

  const JOB = { review: "Review", shepherd: "Reviewer reminders", audit: "Weekly audit", benchmark: "Benchmark", survey: "Security survey", brief: "Morning brief", monitor: "Health check", session: "Session" };
  const RUN_TIP = { pass: "It ended without a warning.", look: "It ended with a warning, or a review stopped.", fail: "It logged an error.", running: "It runs now." };
  const SVC_INK = { ok: "--approved", warn: "--waiting", down: "--closed", na: "--line" };

  // ---------- bridge ----------
  const bridge = window.platform;
  class Said extends Error {}
  const REQUEST_WAIT = 15000, DATA_WAIT = 60000;
  async function api(method, path, body, wait = REQUEST_WAIT) {
    if (!bridge) throw new Said("The page can't load here. Open it from the link the operator shared with you.");

    if (data.ping) {
      const missed = () => toast(`${name()} could not be called right away. Send it again in a minute.`);
      const opts = data.ping_conversation ? { conversation: data.ping_conversation } : undefined;

  }

  // ---------- state ----------

    prPage: "open", prFilter: "reviewing", youFilter: "all", fPage: "all", fFilter: "open", rvPage: "all", rvFilter: "all", runPage: "running", runFilter: "all", pgPage: "all", hPage: "incidents", lPage: "rules", openMods: new Set() };

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const peekTarget = (e) => e.target.closest?.(".anchor[data-item], .cg-ld[data-item], .cg-card[data-item]");
  document.addEventListener("mouseover", (e) => { const el = peekTarget(e); if (el && !el.contains(e.relatedTarget)) peekShow(el); });
  document.addEventListener("mouseout", (e) => { const el = peekTarget(e); if (el && !el.contains(e.relatedTarget)) peekHide(); });
  document.addEventListener("focusin", (e) => { const el = peekTarget(e); if (el) peekShow(el); });
  document.addEventListener("focusout", peekHide);
  document.addEventListener("scroll", () => $("#peek")?.remove(), true);
  document.addEventListener("click", peekHide, true);

  // ---------- tooltips: the page's own box, half a second after the pointer rests ----------
  const toTip = (el) => { if (!el.hasAttribute("aria-label") && !/[\p{L}\p{N}]/u.test(el.textContent)) el.setAttribute("aria-label", el.title); el.dataset.tip = el.title; el.removeAttribute("title"); };
  const OPENS = "[Opens a dialog] ";
  let tipTimer = null, tipLast = 0;
  const tipHide = () => { clearTimeout(tipTimer); if ($("#tip")) { tipLast = Date.now(); $("#tip").remove(); } };
  function tipShow(el) {
    clearTimeout(tipTimer); if (el.title) toTip(el);
    const t = el.dataset.tip; if (!t || el.matches(".anchor[data-item], .cg-ld[data-item]") || el.closest("details.more[open] > summary") || $("#hits")?.hidden === false) return tipHide();
    let box = $("#tip"); if (!box) { box = document.createElement("div"); box.id = "tip"; box.setAttribute("role", "tooltip"); }
    const host = [...document.querySelectorAll("dialog[open]")].pop() || document.body; if (box.parentElement !== host) host.append(box);
    box.textContent = t.startsWith(OPENS) ? t.slice(OPENS.length) : t;
    if (t.startsWith(OPENS)) box.insertAdjacentHTML("afterbegin", `<span class="opens">${esc(OPENS.trim())}</span> `);
    const r = el.getBoundingClientRect(), w = box.offsetWidth, h = box.offsetHeight, below = r.top - 6 - h < 0;
    box.style.left = `${Math.max(8, Math.min(r.left + r.width / 2 - w / 2, innerWidth - w - 8))}px`; box.style.top = `${below ? r.bottom + 6 : r.top - 6 - h}px`;
  }
  const tipTarget = (e) => e.target.closest?.("[data-tip], [title]");
  document.addEventListener("mouseover", (e) => { const el = tipTarget(e); if (!el) return tipHide(); clearTimeout(tipTimer); if ($("#tip") || Date.now() - tipLast < 400) tipShow(el); else tipTimer = setTimeout(() => el.isConnected && tipShow(el), 500); });
  document.addEventListener("mouseout", (e) => { const el = tipTarget(e); if (el && !el.contains(e.relatedTarget)) tipHide(); });
  document.addEventListener("focusin", (e) => { const el = tipTarget(e); if (el?.matches(":focus-visible")) tipShow(el); });
  document.addEventListener("focusout", tipHide); document.addEventListener("scroll", tipHide, true); document.addEventListener("pointerdown", tipHide, true);
  new MutationObserver((ms) => { for (const m of ms) for (const n of m.addedNodes) if (n.nodeType === 1) for (const el of [n, ...n.querySelectorAll("[title]")]) if (el.title && el.tagName !== "IFRAME") toTip(el); }).observe(document.body, { childList: true, subtree: true });
  for (const el of document.querySelectorAll("[title]")) toTip(el);

  // ---------- search: words, a PR's number, a review's, a finding's, a run's ----------
  const goto = $("#goto"), hits = $("#hits");
  let found = [], pick = -1;
  function search(q) {
    q = q.trim().toLowerCase(); if (!q) return [];
    const m = (s) => String(s || "").toLowerCase().includes(q), out = [], n = q.replace(/^#/, "");
    for (const p of prs()) if (`${p.n}` === n || m(p.title)) out.push(["Pull request", p.title || `#${p.n}`, `#${p.n}`, "prs", `#${p.n}`]);
    for (const f of findings()) if (f.id.toLowerCase() === q || m(f.summary) || m(f.file)) out.push(["Finding", f.summary, f.id, "findings", f.id]);
    for (const r of reviews()) if (r.id.toLowerCase() === q) out.push(["Review", `Review of #${r.pr}`, r.id, "runs", r.id]);
    for (const r of runs()) if (r.id.toLowerCase() === q || r.run.toLowerCase() === q) out.push(["Run", runTitle(r), r.id, "runs", r.id]);
    for (const a of arts()) if (m(a.title) || (a.pr && `${a.pr}` === n)) out.push(["Page", a.title, a.pr ? `#${a.pr}` : "", "pages", `page:${a.id}`]);
    for (const e of escapes()) if (e.id.toLowerCase() === q || m(e.class)) out.push(["Escaped", e.class, e.id, "findings", e.id]);
    return out.slice(0, 30);
  }
  const drawHits = () => { hits.hidden = !goto.value.trim(); goto.setAttribute("aria-expanded", String(!hits.hidden));
    const r = goto.getBoundingClientRect(); hits.style.top = `${r.bottom + 4}px`; hits.style.left = `${Math.max(12, Math.min(r.left, innerWidth - hits.offsetWidth - 12))}px`;
    hits.innerHTML = found.length ? found.map(([k, t, n], x) => `<button class="hit" role="option" data-hit="${x}" aria-selected="${x === pick}"><span class="k">${esc(k)}</span><span class="t">${esc(t)}</span>${num(n)}</button>`).join("") : `<div class="none">Nothing found.</div>`; };
  const openHit = (x) => { const h = found[x]; if (!h) return; S.tab = h[3]; S.item = h[4]; place(); goto.value = ""; hits.hidden = true; draw(); };
  goto.addEventListener("input", () => { found = search(goto.value); pick = found.length ? 0 : -1; drawHits(); });
  goto.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); pick = (pick + (e.key === "ArrowDown" ? 1 : -1) + found.length) % Math.max(found.length, 1); drawHits(); }
    else if (e.key === "Enter") { e.preventDefault(); openHit(pick); } else if (e.key === "Escape") { goto.value = ""; hits.hidden = true; }
  });
  hits.addEventListener("mousedown", (e) => { const b = e.target.closest("[data-hit]"); if (b) { e.preventDefault(); openHit(Number(b.dataset.hit)); } });
  goto.addEventListener("blur", () => setTimeout(() => { hits.hidden = true; }, 150));

  // ---------- day and night, the list's fold and width ----------
  const isDark = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const renderTheme = () => { $("#theme").textContent = isDark() ? "☀ Day mode" : "☾ Night mode"; };
  $("#theme").addEventListener("click", () => { const t = isDark() ? "light" : "dark"; document.documentElement.dataset.theme = t; store.set("cg-theme", t); renderTheme(); });
  function foldList(on, remember = true) { $("#main").classList.toggle("folded", on); const b = $("#list-fold"); b.setAttribute("aria-expanded", String(!on)); b.dataset.tip = on ? "Show the list" : "Hide the list"; if (remember) store.set("cg-list-folded", on ? "1" : ""); }
  $("#list-fold").addEventListener("click", () => foldList(!$("#main").classList.contains("folded")));
  if (store.get("cg-list-folded")) foldList(true, false);
  const sizeList = (dx) => { dx = Math.max(-30, Math.min(30, Math.round(dx))); $("#main").style.setProperty("--list-dx", `${dx}px`); store.set("cg-list-dx", dx); return dx; };
  sizeList(Number(store.get("cg-list-dx")) || 0);
  $("#list-grip").addEventListener("pointerdown", (e) => { const g = e.currentTarget, x0 = e.clientX, d0 = Number(store.get("cg-list-dx")) || 0; g.setPointerCapture(e.pointerId);
    const move = (m) => sizeList(d0 + m.clientX - x0), up = () => { g.removeEventListener("pointermove", move); g.removeEventListener("pointerup", up); }; g.addEventListener("pointermove", move); g.addEventListener("pointerup", up); });
  $("#list-grip").addEventListener("dblclick", () => sizeList(0));
  $("#list-grip").addEventListener("keydown", (e) => { const d = Number(store.get("cg-list-dx")) || 0; if (e.key === "ArrowLeft") sizeList(d - 10); else if (e.key === "ArrowRight") sizeList(d + 10); else if (e.key === "Home") sizeList(0); });

  // ---------- loading ----------
  async function refresh() {
    const r = await api("GET", `/api/data${S.hash ? `?have=${encodeURIComponent(S.hash)}` : ""}`, undefined, DATA_WAIT);
    if (!r.unchanged) { S.data = r.data; S.hash = r.hash; parts_.clear(); }
    try { S.status = await api("GET", "/api/status"); } catch (e) { if (!(e instanceof Said)) throw e; }
    await Promise.all([loadJobs(), loadNotes(), S.tab === "settings" ? loadPeople() : null]);
  }
  setInterval(() => { if (!document.hidden && J.list.some((j) => j.mine && (j.state === "queued" || j.state === "started"))) Promise.all([loadJobs(), loadNotes()]).then(() => { S.quiet = true; renderDetail(); renderBell(); S.quiet = false; }); }, 4000);
  let tick = 0, asking = false;
  // One timer: every 16 s, every 4 s while Code Guardian can't be reached. The page never loads itself anew.
  async function poll() {
    tick += 1;
    if (asking || document.hidden || (!S.offline && tick % 4 !== 0)) return;
    asking = true;
    try { await refresh(); if (S.offline) S.offline = false; S.quiet = true; draw(); }
    catch (e) { if (!(e instanceof Said) && !S.offline) { S.offline = true; renderBanners(); } }
    finally { asking = false; S.quiet = false; }
  }
  async function start() {
    if (!bridge) { $("#detail").innerHTML = `<div class="panel">The page can't load here. Open it from the link the operator shared with you.</div>`; $("#main").classList.add("has-detail"); return; }
    for (;;) { try { await load(); break; } catch (e) { $("#detail").innerHTML = `<div class="panel">${esc(e instanceof Said ? e.message : "Code Guardian can't be reached right now. Retrying…")}</div>`; $("#detail").drawn = undefined; $("#main").classList.add("has-detail"); if (e instanceof Said) return; await new Promise((ok) => setTimeout(ok, 4000)); } }
    setInterval(() => { poll().catch(() => {}); }, 4000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) { tick = -1; poll().catch(() => {}); } });
  }
  async function load() {
    S.me = await api("GET", "/api/me");
    const who = S.me.email || human(S.me.role || "viewer");
    $("#me").innerHTML = `<span class="who-full">${esc(who)}</span><span class="av">${esc(who[0].toUpperCase())}</span>`; $("#me-who").textContent = `${who} · ${human(S.me.role || "viewer")}`;
    $("#me").dataset.tip = `You are ${S.me.role === "admin" ? "an admin" : `a ${S.me.role || "viewer"}`}. ${ROLE_DO[S.me.role] || ""}`;
    document.body.classList.toggle("ro", !canAct()); $("#ask-review").hidden = !canAct(); document.querySelector("header > .head-sep").hidden = !canAct();
    document.title = S.me.name || "Code Guardian";
    for (const k of ["prPage", "prFilter", "youFilter", "fPage", "fFilter", "rvPage", "rvFilter", "runPage", "runFilter", "pgPage", "hPage", "lPage"]) { const v = store.get(`cg-${k}`); if (v) S[k] = v; }
    if (!PR_FILTER[S.prFilter]) S.prFilter = "reviewing"; if (!YOU_FILTER[S.youFilter]) S.youFilter = "all"; if (!RUN_PAGE[S.runPage]) S.runPage = "running";
    renderTheme();
    await Promise.all([refresh(), loadAsks()]);
    if (!goTo(location.hash)) draw();
  }
  start().catch(() => {});
})();
</script>
</body>
