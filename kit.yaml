# yaml-language-server: $schema=https://raw.githubusercontent.com/dam-agents/dam-starter-kits/main/kit.schema.json
# The starter kit this definition is offered as. It lives here, beside the
# definition it describes, so a change to the agent and a change to the kit
# offering it are the same commit.
schemaVersion: v1
id: code-guardian
name: Code Guardian
description: >-
  Reviews every open pull request in a repository on a heartbeat, posts one
  structured review per PR, re-reviews on a label, and can nudge human
  reviewers on Slack.
tagline: Every pull request gets a review, within minutes.
category: software
icon: code
harnesses: [claude-code, bob]
docsUrl: https://github.com/dam-agents/code-guardian
# `self` is this repository, at the commit the kit was resolved at, so an
# agent always runs the definition this file shipped with.
seed:
  self: true
  into: home
# The first turn of a new agent. ONBOARDING.md guards itself with the
# $HOME/.code-guardian-onboarded sentinel, so this prompt is safe to repeat.
onboarding:
  prompt: >-
    Read ONBOARDING.md in your home directory and follow it to the end. It asks
    for the repository to review, writes the configuration, reconciles the
    schedules this kit registered, and ends with a summary for the operator.
connections:
  - accepts: [github, github-enterprise]
    required: true
    note: >-
      Connect as a bot account (a GitHub App or a token for a machine user),
      not as the account that opens the pull requests it reviews.
  - accepts: [slack]
    note: >-
      Used by the shepherd sweep, which is created disabled. Turn it on under
      Schedules once Slack is connected. The weekly audit runs without it and
      posts its report to Slack only when Slack is connected.
channels:
  - type: slack
    note: >-
      Where reviewer nudges and the weekly audit report land once Slack is
      connected. Skip it to keep everything in chat.
# The set ONBOARDING.md Step 6 registers, at its default cadence: names, crons,
# `precheck` commands and `task` texts are Step 6's, their single source of truth
# (docs/self-modification.md §3), so a change there is a change here and an
# onboarding run finds these names already present and creates nothing twice.
# `precheck` is the schedule gate (docs/runbook.md → The schedule gate): a fire
# with no work costs no model call. A platform that does not carry the field
# leaves the runs correct but ungated, and every idle tick pays for a session.
# The crons hold the platform's own time. An instance's cadence, hours and days
# are its own (`work/CONFIG.md`), and Step 6 registers them for that instance.
schedules:
  # Review heartbeat (Step 6a) — the active window, plus one quiet schedule per
  # part of the week it leaves uncovered. Same task; the cadence is the only
  # difference, and it follows the cadence keys in work/CONFIG.md.
  - name: code-guardian-review-active
    cron: "*/5 8-21 * * 1-5"
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" review
    task: &review-task >-
      Review heartbeat. The precheck already ran preflight and found work: read
      the worklist JSON at the path its output names, and never run preflight.sh
      again this run. If the prompt carries no worklist path, run `bash
      "$HOME/scripts/preflight.sh" review` yourself. Then follow CLAUDE.md →
      "Review run": read docs/review.md and docs/skills.md, apply the bookkeeping
      arrays (self-heals, label cleanups, prunes), review every PR in reviews_due
      (chat UI + GitHub review with the marker; honour the HEAD-freshness checks,
      locks, and the re-review label gate, removing the label after posting),
      handle artifacts_due per docs/artifact.md, and back up work/ at the end
      (`scripts/work-backup.sh persist`) when GITHUB_REPO_WORK is set.
  - name: code-guardian-review-quiet
    cron: "0 22-23,0-7 * * 1-5"
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" review
    task: *review-task
  - name: code-guardian-review-offdays
    cron: "0 * * * 6,0"
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" review
    task: *review-task
  # Shepherd sweep (Step 6b) — Slack only.
  - name: code-guardian-shepherd-1h-workdays
    cron: "0 7-18 * * 1-5"
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" shepherd
    enabled: false
    task: >-
      Shepherd sweep. The precheck already ran preflight and found nudges due:
      read the worklist JSON at the path its output names, and never run
      preflight.sh again this run. If the prompt carries no worklist path, run
      `bash "$HOME/scripts/preflight.sh" shepherd` yourself. Then follow
      CLAUDE.md → "Shepherd run": read docs/shepherd.md, send exactly the nudges
      in nudges_due to the shared Slack channel (roster-only mentions), apply
      each sent nudge's row_update to the ledger immediately after its send
      (send-then-record), and back up work/ (`scripts/work-backup.sh persist`)
      when GITHUB_REPO_WORK is set.
  # Weekly audit (Step 6c) — every instance gets it: ungated, because its
  # worklist always carries work, and Slack-independent, because the report
  # falls back to the chat UI (docs/config.md → audit_report).
  - name: code-guardian-audit-weekly
    cron: "0 7 * * 5"
    sessionMode: fresh
    task: >-
      Weekly audit. Run `bash "$HOME/scripts/preflight.sh" audit` first — this
      run is ungated. Follow CLAUDE.md → "Audit run": read docs/audit.md, add the
      agent-side checks (schedules, memory compliance, nudge integrity, reaction
      feedback), compose the health report from stats + checks, send it to Slack
      when slack_notifications is enabled (chat UI always), append the AUDIT.log
      line, and back up work/ (`scripts/work-backup.sh persist`) when
      GITHUB_REPO_WORK is set.
  # Model benchmark (Step 6d) — only under `benchmark: enabled`.
  - name: code-guardian-benchmark-monthly
    cron: "0 6 1 * *"
    sessionMode: fresh
    precheck: bash "$HOME/scripts/precheck.sh" benchmark
    enabled: false
    task: >-
      Model benchmark. The precheck already ran preflight and found the benchmark
      due: read the worklist JSON at the path its output names, and never run
      preflight.sh again this run. If the prompt carries no worklist path, run
      `bash "$HOME/scripts/preflight.sh" benchmark` yourself. Then follow
      CLAUDE.md → "Benchmark run": read docs/benchmark.md and perform the action
      in benchmark_due — create_fixture tops the fixture set up to the full set
      (≥5) and ends the run; run replays every fixture review with the configured
      skills (time and tokens measured), scores them with
      scripts/benchmark-score.sh (plus the judge when configured), appends the
      results to work/benchmark/, regenerates and republishes the accumulated
      report, and reports the scores — and back up work/
      (`scripts/work-backup.sh persist`) when GITHUB_REPO_WORK is set.
bundledSkills:
  path: .agents/skills
